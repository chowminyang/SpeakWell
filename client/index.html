<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Medical Communication Practice</title>
    <meta name="description" content="Practice medical communication skills in Simplified Mandarin Chinese and Bahasa Melayu with AI-powered scenarios and feedback." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "@google/generative-ai": "https://esm.sh/@google/generative-ai@0.21.0"
        }
      }
    </script>
    <script>
      // Polyfill for process.env and inject API key from server
      if (!window.process) {
        window.process = { env: {} };
      }
      
      // Try to get API key from URL parameter first
      const urlParams = new URLSearchParams(window.location.search);
      const urlApiKey = urlParams.get('API_KEY') || urlParams.get('GEMINI_API_KEY');
      
      if (urlApiKey) {
        window.process.env.API_KEY = urlApiKey;
        window.process.env.GEMINI_API_KEY = urlApiKey;
      }
      
      // Try to fetch API key from server endpoint
      fetch('/api/config')
        .then(response => response.json())
        .then(config => {
          if (config.geminiApiKey) {
            window.process.env.VITE_GEMINI_API_KEY = config.geminiApiKey;
            window.process.env.GEMINI_API_KEY = config.geminiApiKey;
          }
        })
        .catch(err => console.log('Config fetch failed, using URL params only'));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
